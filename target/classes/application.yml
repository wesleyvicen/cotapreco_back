spring:
  application:
    name: cotapreco
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cotapreco}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  error:
    include-message: never
app:
  jwt:
    secret: ${JWT_SECRET:cotapreco-local-secret-change-me-please-32-characters}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
