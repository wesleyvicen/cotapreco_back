spring:
  datasource:
    url: jdbc:h2:mem:cotapreco;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: localhost
    port: 1025
app:
  seed-local-data: true
  backend-public-url: http://localhost:8080
  jwt:
    secret: test-secret-key-with-at-least-thirty-two-characters
    expiration-minutes: 60
  frontend-url: http://localhost:5173
  frontend-public-url: http://localhost:5173
  email:
    remetente: testes@cotapreco.local
